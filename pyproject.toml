[tool.ruff]
line-length = 88
target-version = "py38"
exclude = ["output", ".venv", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # Enable pycodestyle (E), Pyflakes (F), and isort (I)
ignore = ["E501"]  # Line length handled by Black; long strings/comments are acceptable

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
